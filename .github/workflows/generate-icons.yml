name: Generate iPad home-screen icons
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/logo.svg'
      - '.github/workflows/generate-icons.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Render home-screen PNGs from logo
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          import base64, re, io
          svg=Path("assets/logo.svg").read_text()
          m=re.search(r'base64,([^"]+)',svg)
          if not m:
              raise RuntimeError("Logo image not found")
          raw=base64.b64decode(m.group(1)+'===')
          im=Image.open(io.BytesIO(raw)).convert("RGB")
          im=ImageOps.fit(im,(512,512),method=Image.Resampling.LANCZOS)
          for name,size in [("apple-touch-icon.png",180),("icon-192.png",192),("icon-512.png",512)]:
              im.resize((size,size),Image.Resampling.LANCZOS).save("assets/"+name,optimize=True)
          PY
      - name: Commit PNG icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/apple-touch-icon.png assets/icon-192.png assets/icon-512.png
          git diff --cached --quiet || (git commit -m "assets: add real PNG iPad icons" && git push)
