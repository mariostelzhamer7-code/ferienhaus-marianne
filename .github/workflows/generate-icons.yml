name: Generate iPad icons from 1.0.2 artwork
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/logo-v102.svg'
      - '.github/workflows/generate-icons.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image support
        run: python -m pip install Pillow cairosvg
      - name: Render icon variants
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import io,cairosvg
          png=Path("assets/logo-v102.png")
          if png.exists():
              image=Image.open(png).convert("RGB")
          else:
              data=cairosvg.svg2png(url="assets/logo-v102.svg",output_width=640,output_height=640)
              image=Image.open(io.BytesIO(data)).convert("RGB")
          for name,n in [("apple-touch-icon.png",180),("icon-192.png",192),("icon-512.png",512)]:
              image.resize((n,n),Image.Resampling.LANCZOS).save(Path("assets")/name,format="PNG",optimize=True)
          print("Generated correctly sized iPad icon PNGs")
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/apple-touch-icon.png assets/icon-192.png assets/icon-512.png
          git diff --cached --quiet || (git commit -m "assets: new pale-blue Ferienhaus Marianne app icons" && git push)
