name: Generate iPad home-screen icons
on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/logo-source.b64'
      - '.github/workflows/generate-icons.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Render complete icons from approved logo
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64, zlib, io
          encoded=Path("assets/logo-source.b64").read_text()
          raw=base64.b64decode(encoded,validate=False)
          expected=0xc1a09f11
          actual=zlib.crc32(raw)
          if actual!=expected:
              raise RuntimeError(f"Logo integrity check failed: {actual:08x} vs {expected:08x}")
          im=Image.open(io.BytesIO(raw)).convert("RGB")
          im.load()
          for name,size in [("apple-touch-icon.png",180),("icon-192.png",192),("icon-512.png",512)]:
              im.resize((size,size),Image.Resampling.LANCZOS).save("assets/"+name,optimize=True)
          PY
      - name: Commit real PNG icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/apple-touch-icon.png assets/icon-192.png assets/icon-512.png
          git diff --cached --quiet || (git commit -m "assets: generate verified approved Marianne logo PNGs" && git push)
