name: Improve Marianne photo quality 1.1.1
on:
  push:
    paths:
      - '.github/workflows/photo-clarity-111.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Reprocess existing approved images for HD displays
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageFilter
          paths=sorted(Path("assets/curated").glob("*.jpg"))+sorted(Path("assets/bikes").glob("*.webp"))
          total=0
          for path in paths:
              with Image.open(path) as source:
                  im=ImageOps.exif_transpose(source).convert("RGB")
                  im.load()
              w,h=im.size
              if min(w,h)<1: continue
              target=1600 if "bikes" in path.parts else 1500
              factor=min(3.4,target/max(w,h))
              if factor>1.10:
                  im=im.resize((round(w*factor),round(h*factor)),Image.Resampling.LANCZOS)
                  im=im.filter(ImageFilter.UnsharpMask(radius=1.0,percent=95,threshold=3))
              else:
                  im=im.filter(ImageFilter.UnsharpMask(radius=0.7,percent=45,threshold=4))
              if path.suffix.lower()==".webp":
                  im.save(path,"WEBP",quality=92,method=6)
              else:
                  im.save(path,"JPEG",quality=91,subsampling=0,optimize=True,progressive=True)
              total+=1
              print(path,(w,h),"->",im.size,path.stat().st_size)
          print("Processed",total,"images. Upscaling cannot restore source detail.")
          PY
      - name: Commit photo improvements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/curated/*.jpg assets/bikes/*.webp
          if git diff --cached --quiet; then
            echo "Images unchanged"
          else
            git commit -m "Photo clarity optimization for Marianne 1.1.1"
            git push
          fi
